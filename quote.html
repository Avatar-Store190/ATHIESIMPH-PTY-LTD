<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey:"PASTE_YOUR_API_KEY", authDomain:"PASTE_YOUR_PROJECT.firebaseapp.com", projectId:"PASTE_YOUR_PROJECT_ID", storageBucket:"PASTE_YOUR_PROJECT.appspot.com", messagingSenderId:"PASTE_SENDER_ID", appId:"PASTE_APP_ID" };
try{
  const app=initializeApp(firebaseConfig); const db=getFirestore(app);
  const snap=await getDoc(doc(db,"athiesimph","settings"));
  if(snap.exists() && snap.data().prices){
    const p=snap.data().prices;
    const el=document.getElementById('priceList');
    if(el) el.innerHTML = Object.values(p).map(v=>'- '+v).join('<br>');
  }
}catch(e){ console.log(e); }
</script>
