<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get A Free Quote | ATHIESIMPH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6faf6} header{background:#0e501e;color:#fff;padding:24px;text-align:center}
nav{background:#fff;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)} nav a{margin:0 10px;color:#0e501e;text-decoration:none;font-weight:bold}
.container{max-width:700px;margin:auto;padding:20px 16px}
.card{background:#fff;border:2px solid #0a7a28;border-radius:14px;padding:20px;margin:14px 0}
label{font-weight:bold;display:block;margin-top:14px} input,select,textarea{width:100%;padding:12px;margin-top:6px;border:2px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;background:#0a7a28;color:#fff;padding:14px;border:none;border-radius:30px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:16px}
.btn-yellow{background:#ffcc00;color:#111}
#priceList{color:#0a7a28;font-weight:bold;line-height:1.8;margin-top:8px}
footer{background:#0e501e;color:#fff;text-align:center;padding:20px;margin-top:20px}
</style>
</head>
<body>
<header><h1>🌿 ATHIESIMPH</h1><p>Get A Free Quote — Mfuleni & All Cape Town</p></header>
<nav><a href="index.html">Home</a><a href="quote.html">Get A Free Quote</a><a href="tel:+27685182321">Call</a><a href="owner.html">Owner Login</a></nav>
<div class="container">
<div class="card"><h2 style="color:#0e501e">Current Prices From Cloud</h2><div id="priceList">Loading prices...</div></div>
<div class="card"><h2 style="color:#0e501e">Request Your Free Quote</h2>
<label>Your Name</label><input id="qName" placeholder="e.g. John">
<label>Your Phone / WhatsApp</label><input id="qPhone" placeholder="e.g. 068 518 2321">
<label>What do you need?</label><select id="qService"><option>Landscape Design</option><option>Garden Installation</option><option>Lawn Care</option><option>Irrigation Systems</option><option>Hardscaping</option><option>Maintenance</option><option>Other</option></select>
<label>Details - Size, Location</label><textarea id="qDetails" rows="3" placeholder="e.g. 10x5m garden in Mfuleni, need lawn + paving"></textarea>
<button onclick="sendQuote()">SEND QUOTE ON WHATSAPP →</button>
<p style="text-align:center;color:#666;margin-top:12px">Or call us: 068 518 2321</p>
</div>
</div>
<footer><b>ATHIESIMPH PTY LTD</b><br>44 Tokwane Street, Mfuleni, Cape Town, 7100</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBNclppWsgFBgSy8mYC1f7R3EAsBbKcDAM",
  authDomain: "athiesimph-a556a.firebaseapp.com",
  projectId: "athiesimph-a556a",
  storageBucket: "athiesimph-a556a.firebasestorage.app",
  messagingSenderId: "281015773320",
  appId: "1:281015773320:web:8aced283d754fc6e07173d"
};
try{
  const app=initializeApp(firebaseConfig); const db=getFirestore(app);
  const snap=await getDoc(doc(db,"athiesimph","settings"));
  if(snap.exists() && snap.data().prices){
    const p=snap.data().prices;
    const el=document.getElementById('priceList');
    if(el) el.innerHTML = Object.values(p).map(v=>'- '+v).join('<br>');
  } else { document.getElementById('priceList').textContent='Prices loading - owner must save first version in Owner page.'; }
}catch(e){ console.log(e); document.getElementById('priceList').textContent='Could not load prices.'; }
window.sendQuote=function(){
  const n=document.getElementById('qName').value||'Customer';
  const ph=document.getElementById('qPhone').value||'';
  const s=document.getElementById('qService').value;
  const d=document.getElementById('qDetails').value||'';
  const msg=`Hi Athiesimph! I want a FREE QUOTE:%0AName: ${n}%0APhone: ${ph}%0AService: ${s}%0ADetails: ${d}`;
  window.open("https://wa.me/27685182321?text="+msg);
}
</script>
</body>
</html>
